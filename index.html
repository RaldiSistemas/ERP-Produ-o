<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raldi Produção — Ordens de Produção</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="https://i.postimg.cc/ZKKbdCCF/image-removebg-preview-(18).png">

<meta name="apple-mobile-web-app-capable" content="yes">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
  :root{
    --vermelho:#982424; --vermelho-2:#7f1e1e;
    --fundo:#DBDBD3; --texto:#4B4B55;
    --rail:#232428; --surface:#ffffff; --content:#ecece6;
    --linha:rgba(75,75,85,.14); --muted:color-mix(in srgb,var(--texto) 62%,transparent);
    --submenu:#f2f2ec;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{ font-family:'Archivo',system-ui,sans-serif; color:var(--texto); background:var(--content);
    -webkit-font-smoothing:antialiased; height:100dvh; overflow:hidden; }

  .screen{ position:fixed; inset:0; opacity:0; visibility:hidden; transition:opacity .4s ease, visibility .4s; }
  .screen.active{ opacity:1; visibility:visible; }

  /* ===== Login — terminal industrial ===== */
  .screen--login{ background:#1c1d20; display:flex; align-items:stretch; padding:0; }
  .tm{ position:relative; flex:1; display:grid; grid-template-rows:auto 1fr auto; overflow:hidden; }
  .tm::before{ content:""; position:absolute; inset:0;
    background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
    background-size:52px 52px; pointer-events:none; }
  .tm::after{ content:""; position:absolute; width:640px; height:640px; border-radius:50%;
    background:radial-gradient(circle,rgba(152,36,36,.28) 0%,transparent 65%);
    top:-260px; right:-200px; pointer-events:none; }

  .tm-faixa{ position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between;
    gap:20px; padding:16px 30px; border-bottom:1px solid rgba(255,255,255,.08); }
  .tmf-t{ font-size:10.5px; font-weight:800; letter-spacing:.42em; text-transform:uppercase; color:var(--vermelho); }
  .tmf-b{ display:flex; align-items:flex-end; gap:3px; height:20px; opacity:.35; }
  .tmf-b i{ display:block; width:3px; background:#fff; border-radius:1px; }
  .tmf-b i:nth-child(3n){ width:5px; height:20px; }
  .tmf-b i:nth-child(2n){ height:13px; }
  .tmf-b i:nth-child(4n){ height:20px; width:2px; }
  .tmf-b i{ height:17px; }

  .tm-corpo{ position:relative; z-index:2; display:flex; flex-direction:column; align-items:center;
    justify-content:center; padding:30px 24px; }
  .tm-marca{ display:flex; align-items:center; gap:13px; margin-bottom:26px; }
  .tm-marca img{ height:44px; filter:brightness(0) invert(1); opacity:.95; }
  .tm-nome{ font-family:'Poppins',sans-serif; font-weight:600; font-size:36px; color:#fff; letter-spacing:-.015em; }
  .tm-h{ font-family:'Poppins',sans-serif; font-size:27px; font-weight:600; color:#fff; letter-spacing:-.01em; text-align:center; }
  .tm-p{ font-size:14px; color:rgba(255,255,255,.45); margin:8px 0 30px; text-align:center; max-width:340px; line-height:1.55; }

  .tm-form{ width:min(400px,100%); }
  .tm-f{ margin-bottom:16px; }
  .tm-f label{ display:block; font-size:10.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
    color:rgba(255,255,255,.45); margin-bottom:8px; }
  .tm-f input{ width:100%; font:inherit; font-size:17px; padding:16px 18px; border:1.5px solid rgba(255,255,255,.14);
    border-radius:12px; background:rgba(255,255,255,.05); color:#fff; transition:border-color .15s,background .15s; }
  .tm-f input::placeholder{ color:rgba(255,255,255,.28); }
  .tm-f input:focus{ outline:0; border-color:var(--vermelho); background:rgba(255,255,255,.09); }
  .tm-senha{ position:relative; display:flex; align-items:center; }
  .tm-senha input{ padding-right:56px; }
  .tm-eye{ position:absolute; right:8px; width:40px; height:40px; border:0; background:transparent;
    color:rgba(255,255,255,.4); cursor:pointer; border-radius:9px; display:grid; place-items:center; }
  .tm-eye:hover{ background:rgba(255,255,255,.08); color:#fff; }
  .tm-eye svg{ width:20px; height:20px; }
  .tm-err{ font-size:13px; font-weight:600; color:#e57373; min-height:20px; margin-bottom:8px; }
  .tm-btn{ display:flex; align-items:center; justify-content:center; gap:11px; width:100%; font:inherit;
    font-size:17px; font-weight:700; padding:17px; border:0; border-radius:12px; background:var(--vermelho);
    color:#fff; cursor:pointer; letter-spacing:.01em; transition:background .15s,transform .1s;
    box-shadow:0 8px 24px rgba(152,36,36,.35); }
  .tm-btn:hover{ background:#b02a2a; }
  .tm-btn:active{ transform:translateY(1px); }
  .tm-btn:disabled{ opacity:.45; box-shadow:none; cursor:default; }
  .tm-btn svg{ width:20px; height:20px; }

  .tm-pe{ position:relative; z-index:2; display:flex; align-items:center; justify-content:center; gap:14px;
    padding:16px 30px; border-top:1px solid rgba(255,255,255,.08);
    font-size:11.5px; color:rgba(255,255,255,.32); }
  .tm-sep{ width:3px; height:3px; border-radius:50%; background:rgba(255,255,255,.25); }
  #tmRelogio{ font-family:ui-monospace,monospace; letter-spacing:.08em; }

  .lg-diag{ width:min(400px,100%); font-size:12px; line-height:1.55; margin-top:22px; padding:12px 14px;
    border-radius:10px; text-align:center; }
  .lg-diag:empty{ display:none; }
  .lg-diag.ok{ background:rgba(255,255,255,.05); color:rgba(255,255,255,.4); }
  .lg-diag.ok b{ color:rgba(255,255,255,.7); }
  .lg-diag.erro{ background:rgba(152,36,36,.16); border:1px solid rgba(152,36,36,.4); color:#f0a6a6; text-align:left; }
  .lg-diag.erro b{ display:block; color:#fff; margin-bottom:4px; }

  @media(max-width:520px){
    .tm-nome{ font-size:30px; } .tm-marca img{ height:36px; }
    .tm-h{ font-size:22px; } .tm-corpo{ padding:24px 18px; }
    .tmf-b{ display:none; }
  }
  @media(max-height:620px){
    .tm-marca{ margin-bottom:16px; } .tm-p{ margin-bottom:20px; }
  }

  /* ===== Shell ===== */
  .shell{ display:flex; flex-direction:column; height:100dvh; }
  .top{ background:var(--rail); display:flex; align-items:center; gap:18px; padding:0 20px;
    height:62px; flex:0 0 62px; }
  .top-brand{ display:flex; align-items:center; gap:11px; }
  .top-brand img{ height:32px; filter:brightness(0) invert(1); }
  .tb-t{ line-height:1; }
  .tb-t b{ display:block; font-family:'Poppins',sans-serif; font-size:17px; font-weight:600; color:#fff; }
  .tb-t span{ display:block; font-size:8px; font-weight:700; letter-spacing:.3em; text-transform:uppercase;
    color:rgba(255,255,255,.5); margin-top:3px; }
  .top-nav{ display:flex; gap:3px; margin-left:14px; flex:1; overflow-x:auto; }
  .tn{ font:inherit; font-size:14px; font-weight:600; color:rgba(255,255,255,.62); background:transparent;
    border:0; padding:9px 16px; border-radius:9px; cursor:pointer; white-space:nowrap; transition:background .14s,color .14s; }
  .tn:hover{ background:rgba(255,255,255,.08); color:#fff; }
  .tn.on{ background:var(--vermelho); color:#fff; }
  .top-dir{ display:flex; align-items:center; gap:12px; }
  .td-user{ font-size:12.5px; color:rgba(255,255,255,.6); max-width:170px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .td-b{ border:0; background:rgba(255,255,255,.08); color:rgba(255,255,255,.75); cursor:pointer;
    width:36px; height:36px; border-radius:9px; display:grid; place-items:center; }
  .td-b:hover{ background:var(--vermelho); color:#fff; }
  .td-b svg{ width:18px; height:18px; }
  .corpo{ flex:1; overflow-y:auto; padding:26px 24px 40px; }
  .sync-off{ position:fixed; top:0; left:0; right:0; background:var(--vermelho); color:#fff; font-size:13px;
    font-weight:600; text-align:center; padding:7px; z-index:200; display:none; }
  .sync-off.show{ display:block; }
  @media(max-width:700px){
    .top{ height:auto; flex-wrap:wrap; padding:10px 14px; gap:10px; }
    .top-nav{ order:3; width:100%; margin-left:0; }
    .td-user{ display:none; }
    .corpo{ padding:18px 14px 34px; }
  }

  /* ===== Base reaproveitada ===== */
  .page{ max-width:1320px; margin:0 auto; }
  .page-wide{ max-width:1480px; }
  .page-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:22px; }
  .page-title{ font-size:24px; font-weight:700; color:var(--texto); }
  .page-sub{ font-size:13px; color:var(--muted); margin-top:3px; }
  .btn{ font:inherit; font-weight:600; font-size:14px; border-radius:9px; padding:10px 18px; cursor:pointer;
    border:1px solid transparent; transition:background .15s; }
  .btn-primary{ background:var(--vermelho); color:#fff; }
  .btn-primary:hover{ background:var(--vermelho-2); }
  .btn-ghost{ background:var(--surface); color:var(--texto); border-color:var(--linha); }
  .btn-ghost:hover{ background:rgba(75,75,85,.06); }
  .btn-sm{ padding:6px 13px; font-size:13px; }
  .btn:disabled{ cursor:default; }
  .link-btn{ border:0; background:transparent; color:var(--vermelho); font:inherit; font-weight:600; font-size:13px; cursor:pointer; }
  .search{ font:inherit; font-size:14px; padding:10px 13px; border:1px solid var(--linha); border-radius:9px;
    background:var(--surface); color:var(--texto); }
  .search:focus{ outline:2px solid var(--vermelho); outline-offset:1px; border-color:transparent; }
  .toolbar{ margin-bottom:14px; }
  .table-wrap{ background:var(--surface); border:1px solid var(--linha); border-radius:12px; overflow:hidden; }
  .table-scroll{ overflow-x:auto; }
  .tbl{ width:100%; border-collapse:collapse; font-size:13.5px; }
  .tbl th{ text-align:left; font-weight:600; font-size:11px; letter-spacing:.04em; text-transform:uppercase;
    color:var(--muted); padding:9px 14px; border-bottom:1px solid var(--linha); background:#faf9f5; white-space:nowrap; }
  .tbl td{ padding:8px 14px; border-bottom:1px solid var(--linha); color:var(--texto); vertical-align:middle; line-height:1.35; }
  .tbl tr:last-child td{ border-bottom:0; }
  .tbl tbody tr:hover td{ background:rgba(75,75,85,.03); }
  .cel-nome{ font-weight:600; }
  .cel-sub{ font-size:11.5px; color:var(--muted); margin-top:1px; }
  .cel-disc{ font-size:12.5px; color:color-mix(in srgb,var(--texto) 82%,transparent); }
  .ctr{ text-align:center; }
  .acoes{ text-align:right; white-space:nowrap; }
  .td-empty{ text-align:center; color:var(--muted); padding:22px; }
  .icon-btn{ border:0; background:transparent; color:var(--muted); cursor:pointer; padding:5px; border-radius:6px; line-height:0; }
  .icon-btn:hover{ background:rgba(75,75,85,.08); color:var(--texto); }
  .icon-btn.danger:hover{ background:rgba(152,36,36,.1); color:var(--vermelho); }
  .icon-btn.is-off{ opacity:.3; cursor:not-allowed; }
  .icon-btn svg{ width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .fs{ background:var(--surface); border:1px solid var(--linha); border-radius:12px; padding:18px 20px 20px; }
  .fs-title{ font-size:12.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--vermelho); margin-bottom:16px; }
  .fs-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px 18px; }
  .fld{ display:flex; flex-direction:column; gap:6px; }
  .fld.full{ grid-column:1/-1; }
  .fld.small{ max-width:130px; }
  .fld label{ font-size:12.5px; font-weight:600; color:var(--texto); }
  .fld label i{ color:var(--vermelho); font-style:normal; margin-left:2px; }
  .fld input,.fld select,.fld textarea{ font:inherit; font-size:14px; padding:10px 12px; border:1px solid var(--linha);
    border-radius:8px; background:#fff; color:var(--texto); width:100%; }
  .fld input:focus,.fld select:focus,.fld textarea:focus{ outline:2px solid var(--vermelho); outline-offset:1px; border-color:transparent; }
  .fld textarea{ min-height:76px; resize:vertical; }
  .fld-hint{ font-size:11.5px; color:var(--muted); margin-top:4px; display:block; }
  .aviso{ font-size:13px; color:var(--muted); background:#faf9f5; border:1px dashed var(--linha); border-radius:8px; padding:10px 12px; }
  .wiz-nav{ display:flex; justify-content:space-between; gap:10px; margin-top:20px; }
  .empty{ text-align:center; padding:56px 20px; background:var(--surface); border:1px dashed var(--linha); border-radius:14px; }
  .empty .e-ic{ width:56px; height:56px; margin:0 auto 14px; border-radius:14px; background:rgba(152,36,36,.08);
    color:var(--vermelho); display:grid; place-items:center; }
  .empty .e-ic svg{ width:26px; height:26px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .empty h3{ font-size:16px; font-weight:700; color:var(--texto); margin-bottom:6px; }
  .empty p{ font-size:13.5px; color:var(--muted); margin-bottom:16px; }
  .ck{ width:16px; height:16px; accent-color:var(--vermelho); cursor:pointer; }
  .row-sel td{ background:rgba(152,36,36,.05) !important; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ display:inline-flex; align-items:center; gap:6px; background:rgba(152,36,36,.09); color:var(--vermelho);
    font-size:13px; font-weight:600; padding:5px 8px 5px 12px; border-radius:999px; }
  .chip button{ border:0; background:transparent; color:var(--vermelho); cursor:pointer; line-height:0; padding:2px; border-radius:50%; }
  .dot{ display:inline-block; width:9px; height:9px; border-radius:50%; flex:0 0 9px; }
  .dot-lg{ width:12px; height:12px; flex:0 0 12px; box-shadow:0 0 0 3px rgba(0,0,0,.05); }
  .st-resumo{ display:flex; gap:18px; flex-wrap:wrap; margin-bottom:14px; padding:12px 16px;
    background:var(--surface); border:1px solid var(--linha); border-radius:10px; }
  .st-item{ display:flex; align-items:center; gap:7px; font-size:13px; color:var(--muted); }
  .st-item b{ color:var(--texto); font-weight:700; }
  .st-sel{ font:inherit; font-size:12.5px; padding:4px 8px; border:1px solid var(--linha); border-radius:7px;
    background:#fff; color:var(--texto); cursor:pointer; }
  .st-sel:focus{ outline:2px solid var(--vermelho); outline-offset:1px; border-color:transparent; }
  .st-ro{ display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; }
  .inv-filtros{ display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
  .inv-filtros .search{ flex:1; min-width:230px; }
  .inv-filtros select{ font:inherit; font-size:13.5px; padding:10px 12px; border:1px solid var(--linha);
    border-radius:9px; background:var(--surface); color:var(--texto); min-width:170px; }
  .inv-filtros select:focus{ outline:2px solid var(--vermelho); outline-offset:1px; border-color:transparent; }
  .op-tempo{ font-weight:700; }
  .op-fora{ color:#8a5a13 !important; font-weight:600; }
  .qt-row{ display:flex; align-items:center; gap:9px; }
  .qt-row input{ flex:1; }
  .cod-prev{ font-family:ui-monospace,monospace; font-size:15px; font-weight:600; color:var(--vermelho);
    background:rgba(152,36,36,.07); border:1px dashed rgba(152,36,36,.3); border-radius:8px; padding:10px 12px; }
  .toast{ position:fixed; left:50%; bottom:28px; transform:translate(-50%,20px); background:var(--texto); color:#f4f4ef;
    font-size:14px; font-weight:500; padding:13px 20px; border-radius:10px; opacity:0; pointer-events:none;
    transition:opacity .25s,transform .25s; z-index:300; }
  .toast.show{ opacity:1; transform:translate(-50%,0); }
  .rx-ov{ position:fixed; inset:0; background:rgba(35,36,40,.5); display:none; align-items:center;
    justify-content:center; padding:20px; z-index:250; overflow-y:auto; }
  .rx-ov.open{ display:flex !important; }
  .rx-box{ width:min(560px,100%); background:var(--surface); border-radius:14px;
    box-shadow:0 24px 60px rgba(0,0,0,.28); overflow:hidden; }
  .rx-h{ display:flex; align-items:center; justify-content:space-between; padding:17px 20px; border-bottom:1px solid var(--linha); }
  .rx-h h3{ font-size:17px; font-weight:700; color:var(--texto); }
  .rx-b{ padding:20px; max-height:66vh; overflow-y:auto; }
  .rx-b select{ font:inherit; font-size:14px; padding:10px 12px; border:1px solid var(--linha);
    border-radius:8px; background:#fff; color:var(--texto); width:100%; }
  .rx-b select:focus{ outline:2px solid var(--vermelho); outline-offset:1px; border-color:transparent; }
  .rx-f{ display:flex; justify-content:flex-end; gap:10px; padding:15px 20px; background:#faf9f5; border-top:1px solid var(--linha); }
  .ficha-overlay{ position:fixed; inset:0; background:rgba(35,36,40,.55); display:none; flex-direction:column;
    align-items:center; padding:26px 16px; overflow-y:auto; z-index:240; }
  .ficha-overlay.open{ display:flex; }
  .ficha-actions{ display:flex; gap:10px; justify-content:flex-end; margin-bottom:12px; }
  .col-ordem{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .col-ordem span{ font-size:11px; color:var(--muted); background:#f4f3ef; padding:3px 8px; border-radius:5px; }
  .col-ordem b{ color:var(--vermelho); font-family:ui-monospace,monospace; margin-right:3px; }
  .col-txt{ width:100%; min-height:120px; font-family:ui-monospace,monospace; font-size:12px;
    padding:11px 13px; border:1px solid var(--linha); border-radius:9px; resize:vertical; color:var(--texto); }
  .col-txt:focus{ outline:2px solid var(--vermelho); outline-offset:1px; border-color:transparent; }
  .col-prev{ margin-top:14px; }
  .cp-r{ font-size:13px; color:var(--muted); margin-bottom:9px; }
  .cp-r b{ color:var(--texto); }
  .cp-w{ display:inline-block; font-size:11px; color:#8a5a13; background:#fdf1dc; padding:2px 8px; border-radius:5px; margin-left:6px; }
  .cp-t{ width:100%; border-collapse:collapse; font-size:11.5px; }
  .cp-t th{ text-align:left; font-size:9.5px; font-weight:700; text-transform:uppercase; color:var(--muted);
    padding:5px 7px; background:#faf9f5; border-bottom:1px solid var(--linha); white-space:nowrap; }
  .cp-t td{ padding:5px 7px; border-bottom:1px solid var(--linha); color:var(--texto);
    max-width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cp-m{ text-align:center; color:var(--muted); font-style:italic; }
  .chk{ display:flex; align-items:flex-start; gap:9px; cursor:pointer; font-size:13.5px; color:var(--texto); }
  .chk input{ width:17px; height:17px; accent-color:var(--vermelho); margin-top:1px; flex:0 0 17px; cursor:pointer; }
  .chk i{ display:block; font-style:normal; font-size:11.5px; color:var(--muted); margin-top:2px; }
/* Relatório do projeto */
  .rp-topo{ display:grid; grid-template-columns:auto 1fr; gap:18px; align-items:stretch; margin-bottom:18px; }
  @media(max-width:760px){ .rp-topo{ grid-template-columns:1fr; } }
  .rp-donut{ display:flex; align-items:center; gap:16px; background:var(--surface);
    border:1px solid var(--linha); border-radius:13px; padding:16px 22px; }
  .dn{ width:118px; height:118px; flex:0 0 118px; }
  .rpd-l b{ display:block; font-size:16px; }
  .rpd-l span{ display:block; font-size:12.5px; color:var(--muted); margin-top:3px; max-width:150px; line-height:1.45; }
  .rp-kpis{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  @media(min-width:1100px){ .rp-kpis{ grid-template-columns:repeat(4,1fr); } }
  .rpk{ background:var(--surface); border:1px solid var(--linha); border-radius:13px; padding:15px 17px;

  /* ===== Motor de tempo (jornada, intervalos, feriados, hora extra) ===== */
  const JORNADA_PADRAO={ ini:'07:30', fim:'18:00', dias:[1,2,3,4,5],
    intervalos:[{de:'09:00',ate:'09:15'},{de:'12:00',ate:'13:30'},{de:'16:00',ate:'16:15'}] };
  // Sábado, domingo e feriado: o dia inteiro é hora extra.
  // Segunda a sexta: tudo que fica antes da abertura e depois do fechamento da jornada.
  // Sem recorte de horário — trabalho de madrugada e virada de dia contam.
  const HE_JANELA={ ini:'00:00', fim:'24:00' };
  let FERIADOS={};                                 // {'2026-12-25':{data,nome}}

  function jhm(s){ const [h,m]=String(s||'0:0').split(':').map(Number); return (h||0)*60+(m||0); }
  function jmin(d){ return d.getHours()*60+d.getMinutes()+d.getSeconds()/60; }
  function jdia(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function jover(a1,a2,b1,b2){ return Math.max(0, Math.min(a2,b2)-Math.max(a1,b1)); }
  function ehFeriado(d){ return !!FERIADOS[jdia(d)]; }
  // aceita jornadas antigas (intIni/intFim) e novas (intervalos[])
  function intervalosDe(j){
    if(j && j.semIntervalo) return [];                       // jornada sem parada declarada
    if(j && Array.isArray(j.intervalos) && j.intervalos.length) return j.intervalos;
    if(j && j.intervalos && typeof j.intervalos==='object') return Object.values(j.intervalos);
    if(j && j.intIni && j.intFim) return [{de:j.intIni,ate:j.intFim}];
    return JORNADA_PADRAO.intervalos;
  }
  function diasDe(j){ return (j && j.dias && j.dias.length)?j.dias:JORNADA_PADRAO.dias; }
  function ehDiaUtil(d,j){ return diasDe(j).includes(d.getDay()) && !ehFeriado(d); }

  // percorre dia a dia entre duas datas e soma minutos de cada janela
  function percorre(iniISO,fimISO,j,fn){
    const ini=new Date(iniISO), fim=new Date(fimISO);
    if(!(fim>ini)) return 0;
    let total=0,g=0;
    const cur=new Date(ini.getFullYear(),ini.getMonth(),ini.getDate());
    const ult=new Date(fim.getFullYear(),fim.getMonth(),fim.getDate());
    while(cur<=ult && g++<400){
      const mi=jdia(cur)===jdia(ini), mf=jdia(cur)===jdia(fim);
      const a=mi?jmin(ini):0, b=mf?jmin(fim):1440;
      total+=fn(cur,a,b);
      cur.setDate(cur.getDate()+1);
    }
    return total;
  }
  // arredonda só quando o chamador não pediu o valor exato (cronômetro do lead time)
  function _rd(exato,v){ return exato?v:Math.round(v); }
  // minutos DENTRO da jornada (dia útil, fora dos intervalos)
  function tempoTrabalhado(iniISO,fimISO,j,exato){
    j=j||JORNADA_PADRAO;
    const jI=jhm(j.ini||JORNADA_PADRAO.ini), jF=jhm(j.fim||JORNADA_PADRAO.fim);
    const ints=intervalosDe(j);
    return _rd(exato,percorre(iniISO,fimISO,j,(dia,a,b)=>{
      if(!ehDiaUtil(dia,j)) return 0;
      let t=jover(a,b,jI,jF);
      ints.forEach(iv=>{ t-=jover(Math.max(a,jI),Math.min(b,jF),jhm(iv.de),jhm(iv.ate)); });
      return Math.max(0,t);
    }));
  }
  // minutos FORA da jornada, dentro da janela de hora extra
  function tempoHoraExtra(iniISO,fimISO,j,exato){
    j=j||JORNADA_PADRAO;
    const jI=jhm(j.ini||JORNADA_PADRAO.ini), jF=jhm(j.fim||JORNADA_PADRAO.fim);
    const hI=jhm(HE_JANELA.ini), hF=jhm(HE_JANELA.fim);
    return _rd(exato,percorre(iniISO,fimISO,j,(dia,a,b)=>{
      const janela=jover(a,b,hI,hF);
      if(!janela) return 0;
      if(!ehDiaUtil(dia,j)) return janela;              // sábado, domingo ou feriado: tudo é extra
      return Math.max(0, janela - jover(a,b,jI,jF));    // antes de abrir e depois de fechar
    }));
  }
  /* Fora da jornada = antes de abrir, depois de fechar, ou dia não trabalhado.
     Diferente de dentroExpediente(): o intervalo de almoço NÃO é hora extra. */
  function foraJornada(dt,j){
    j=j||JORNADA_PADRAO;
    if(!ehDiaUtil(dt,j)) return true;
    const m=jmin(dt);
    return m<jhm(j.ini||JORNADA_PADRAO.ini) || m>=jhm(j.fim||JORNADA_PADRAO.fim);
  }
  function dentroExpediente(dt,j){
    j=j||JORNADA_PADRAO;
    if(!ehDiaUtil(dt,j)) return false;
    const m=jmin(dt);
    if(m<jhm(j.ini||JORNADA_PADRAO.ini)||m>jhm(j.fim||JORNADA_PADRAO.fim)) return false;
    return !intervalosDe(j).some(iv=>m>jhm(iv.de)&&m<jhm(iv.ate));
  }
  function motivoFora(dt,j){
    j=j||JORNADA_PADRAO;
    if(ehFeriado(dt)) return 'feriado ('+(FERIADOS[jdia(dt)].nome||'')+')';
    if(!diasDe(j).includes(dt.getDay())) return dt.getDay()===0?'domingo':'sábado';
    const m=jmin(dt);
    if(m<jhm(j.ini||JORNADA_PADRAO.ini)) return 'antes do expediente';
    if(m>jhm(j.fim||JORNADA_PADRAO.fim)) return 'depois do expediente';
    const iv=intervalosDe(j).find(x=>m>jhm(x.de)&&m<jhm(x.ate));
    return iv?('intervalo '+iv.de+'–'+iv.ate):'fora do expediente';
  }
  function fmtMin(m){
    if(!m||m<=0) return '0min';
    const h=Math.floor(m/60), r=Math.round(m%60);
    return (h?h+'h':'')+(r?(h?' ':'')+r+'min':(h?'':'0min'));
  }
  function fmtJornada(j){
    j=j||JORNADA_PADRAO;
    const ints=intervalosDe(j);
    return (j.ini||JORNADA_PADRAO.ini)+'–'+(j.fim||JORNADA_PADRAO.fim)+
      ' · int. '+(ints.length?ints.map(i=>i.de+'–'+i.ate).join(', '):'sem intervalo');
  }


  /* ===== Funcionários da OP (um ou vários) ===== */
  function funcsDe(o,fase){
    const f=o&&o[fase];
    if(!f) return [];
    if(Array.isArray(f.funcs)&&f.funcs.length) return f.funcs;
    if(f.funcs&&typeof f.funcs==='object'){ const v=Object.values(f.funcs); if(v.length) return v; }
    return f.func?[f.func]:[];
  }
  function nomesFuncs(o,fase){ const l=funcsDe(o,fase); return l.length?l.join(', '):''; }
  function funcResumo(o,fase){
    const l=funcsDe(o,fase);
    if(!l.length) return '';
    return l.length===1?l[0]:(l[0]+' +'+(l.length-1));
  }
  function equipeOP(o){
    const s=new Set([...funcsDe(o,'inicio'),...funcsDe(o,'fim')]);
    return [...s];
  }

  /* ===== Feriados ===== */
  function listaFeriados(){ return Object.values(FERIADOS).sort((a,b)=>String(a.data).localeCompare(String(b.data))); }
  function addFeriado(data,nome){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(data)){ toast('Data inválida'); return Promise.reject(); }
    return db.ref('feriados/'+data).set({data,nome:(nome||'').trim()||'Feriado',
      criadoEm:new Date().toISOString(),criadoPor:usuarioAtual()});
  }
  function delFeriado(data){ return db.ref('feriados/'+data).remove(); }


  /* ===== Tempo da OP: normal + hora extra + pausas ===== */
  // hora extra só conta quando a OP foi explicitamente marcada como extra
  function tempoNormalOP(o,ate,exato){
    if(!o||!o.inicio||!o.inicio.em) return 0;
    const f=ate||(o.fim&&o.fim.em)||new Date().toISOString();
    const bruto=tempoTrabalhado(o.inicio.em,f,o.jornada,true);
    const pausado=pausasEfetivas(o).reduce((a,p)=>a+((p&&p.de)?tempoTrabalhado(p.de,p.ate||f,o.jornada,true):0),0);
    return _rd(exato,Math.max(0,bruto-pausado));
  }
  /* ===== Hora extra por SESSÃO =============================================
     extras: [{de:ISO, ate:ISO|null, por, funcs}]
     O operador declara a hora extra pelos botões "Iniciar / Finalizar hora
     extra" na tela de apontamento. Só o tempo dentro de uma sessão declarada
     (e fora da jornada) conta como extra; pausas abertas nesse intervalo são
     descontadas. OPs antigas, marcadas apenas com o.extra=true, continuam
     valendo pelo caminho de compatibilidade no fim da função.               */
  function extrasDe(o){ const e=o&&o.extras; return e?(Array.isArray(e)?e:Object.values(e)):[]; }
  function extraAberta(o){ return extrasDe(o).find(e=>e&&e.de&&!e.ate)||null; }
  function tempoExtraOP(o,ate,exato){
    if(!o||!o.inicio||!o.inicio.em) return 0;
    const f=ate||(o.fim&&o.fim.em)||new Date().toISOString();
    const ss=extrasDe(o);
    if(ss.length){
      let t=0;
      ss.forEach(s=>{
        if(!s||!s.de) return;
        const sf=s.ate||f;
        if(!(sf>s.de)) return;
        let b=tempoHoraExtra(s.de,sf,o.jornada,true);
        pausasEfetivas(o).forEach(p=>{
          if(!p||!p.de) return;
          const pa=p.ate||f;
          const pi=(p.de>s.de)?p.de:s.de, pf=(pa<sf)?pa:sf;
          if(pf>pi) b-=tempoHoraExtra(pi,pf,o.jornada,true);
        });
        t+=Math.max(0,b);
      });
      return _rd(exato,t);
    }
    if(!o.extra) return 0;
    const bruto=tempoHoraExtra(o.inicio.em,f,o.jornada,true);
    const pausado=pausasEfetivas(o).reduce((a,p)=>a+((p&&p.de)?tempoHoraExtra(p.de,p.ate||f,o.jornada,true):0),0);
    return _rd(exato,Math.max(0,bruto-pausado));
  }
  function tempoTotalOP(o,ate,exato){
    const t=tempoNormalOP(o,ate,true)+tempoExtraOP(o,ate,true);
    return _rd(exato,t);
  }


  /* ===================== LEAD TIME =========================================
     Banco: leadtimes/{projeto}/{atividade} = {projeto,atividade,setor,horas,por,em}
     Cadastro OPCIONAL e por projeto — só as atividades que precisam de prazo.
     O cronômetro anda sobre o tempo TRABALHADO da OP (tempoTotalOP), então ele
     pausa junto com a OP e congela fora do expediente, sem código extra.     */
  let LEADS={};
  function ltSlug(s){
    return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'')||'_';
  }
  function leadHoras(projeto,atividade){
    const p=LEADS[ltSlug(projeto)]; if(!p) return null;
    const r=p[ltSlug(atividade)];
    const h=r?Number(r.horas):NaN;
    return (isFinite(h)&&h>0)?h:null;
  }
  // OP de lote vale para vários projetos: usa o maior prazo cadastrado entre eles
  function leadMinOP(o){
    if(!o||!o.atividade) return null;
    const projs=(o.tipo==='lote'&&(o.projetosLote||[]).length)
      ? (o.projetosLote||[]).map(r=>r&&r.projeto) : [o.projeto];
    let h=null;
    projs.filter(Boolean).forEach(p=>{ const v=leadHoras(p,o.atividade); if(v!=null) h=(h==null?v:Math.max(h,v)); });
    if(h!=null) return Math.round(h*60);
    // OP encerrada guarda o prazo que valia na época — o histórico não é reescrito
    const g=Number(o.leadMin);
    return (o.status==='encerrada'&&isFinite(g)&&g>0)?g:null;
  }
  function leadStatus(o){
    const lm=leadMinOP(o); if(lm==null||lm<=0) return null;
    const st=stOp(o);
    const ate=(st==='encerrada'&&o.fim&&o.fim.em)?o.fim.em:new Date().toISOString();
    const gasto=(st==='nao')?0:tempoTotalOP(o,ate,true);
    const restSeg=Math.round((lm-gasto)*60);
    return {leadMin:lm, gastoMin:gasto, restSeg, atrasado:restSeg<0,
      pct:Math.max(0,Math.min(100,Math.round(gasto/lm*100))), st, rodando:st==='parcial'};
  }
  function fmtCron(seg){
    const n=Math.abs(Math.round(seg));
    const h=Math.floor(n/3600), m=Math.floor((n%3600)/60), s=n%60;
    return (seg<0?'-':'')+h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }
  // atualiza só os nós do cronômetro — nunca re-renderiza a tela a cada segundo
  function tickLead(){
    const els=document.querySelectorAll('[data-lt-op]');
    for(let i=0;i<els.length;i++){
      const el=els[i];
      const o=OPS.find(x=>x.id===el.getAttribute('data-lt-op')); if(!o) continue;
      const L=leadStatus(o); if(!L) continue;
      el.textContent=fmtCron(L.restSeg);
      const box=el.closest('.lt-box')||el.closest('.lt-mini');
      if(box){ box.classList.toggle('atr',L.atrasado); box.classList.toggle('parado',!L.rodando); }
      const bar=box&&box.querySelector('.lt-bar i');
      if(bar){ bar.style.width=L.pct+'%'; }
    }
  }
  setInterval(tickLead,1000);

  function stOp(o){ return (o&&ST_OP[o.status])?o.status:'nao'; }

  /* ===== Pausa da OP (compartilhado) ===== */
  // pausas: [{de:ISO, ate:ISO|null, func, por}]
  function pausasDe(o){ const p=o&&o.pausas; return p?(Array.isArray(p)?p:Object.values(p)):[]; }
  function pausaAberta(o){ return pausasDe(o).find(p=>p&&p.de&&!p.ate)||null; }
  /* Pausas validas para o apontamento atual. Rede de seguranca contra dado
     sujo (OP resetada/editada que ficou com pausa de um apontamento
     anterior): pausa encerrada antes do inicio atual e descartada, e pausa
     que comecou antes do inicio e cortada no inicio. */
  function pausasEfetivas(o){
    const ini=o&&o.inicio&&o.inicio.em;
    const lista=pausasDe(o).filter(p=>p&&p.de);
    if(!ini) return lista;
    return lista.reduce((acc,p)=>{
      if(p.ate&&p.ate<=ini) return acc;
      acc.push(p.de<ini?{...p,de:ini}:p);
      return acc;
    },[]);
  }
  function minutosPausados(o,ateISO){
    const fim=ateISO||new Date().toISOString();
    return pausasDe(o).reduce((a,p)=>{
      if(!p||!p.de) return a;
      const f=p.ate||fim;
      return a+tempoTrabalhado(p.de,f,o.jornada);
    },0);
  }
  // tempo líquido = tempo na jornada menos o que ficou pausado
  function tempoLiquido(o,ateISO){ return tempoTotalOP(o,ateISO); }
  function pausarOP(id){
    const o=OPS.find(x=>x.id===id); if(!o) return;
    if(stOp(o)!=='parcial'){ toast('Só é possível pausar uma OP em andamento'); return; }
    if(pausaAberta(o)){ toast('Esta OP já está pausada'); return; }
    const motivo=prompt('Motivo da pausa (opcional):','');
    if(motivo===null) return;
    const agora=new Date().toISOString(), quem=usuarioAtual();
    const lista=pausasDe(o).slice();
    lista.push({de:agora,ate:null,motivo:(motivo||'').trim(),func:(o.inicio&&o.inicio.func)||'',por:quem});
    db.ref('ops/'+id).update({status:'pausada',pausas:lista})
      .then(()=>{ toast('OP pausada — o tempo parou'); })
      .catch(e=>toast('Erro: '+e.message));
  }
  function retomarOP(id){
    const o=OPS.find(x=>x.id===id); if(!o) return;
    const ab=pausaAberta(o);
    if(!ab){ toast('Esta OP não está pausada'); return; }
    const agora=new Date().toISOString();
    const lista=pausasDe(o).map(p=>(p===ab||(p.de===ab.de&&!p.ate))?{...p,ate:agora}:p);
    db.ref('ops/'+id).update({status:'parcial',pausas:lista})
      .then(()=>{ toast('OP retomada'); })
      .catch(e=>toast('Erro: '+e.message));
  }
  function totalPausas(o){ return pausasEfetivas(o).length; }


  /* ---- Hora extra: sessões declaradas pelo operador ---- */
  function iniciarExtra(id){
    const o=OPS.find(x=>x.id===id); if(!o) return;
    if(stOp(o)==='nao'){ toast('Inicie a OP antes de apontar hora extra'); return; }
    if(stOp(o)==='encerrada'){ toast('Esta OP já está encerrada'); return; }
    if(extraAberta(o)){ toast('Já existe hora extra em andamento'); return; }
    const agora=new Date();
    if(!foraJornada(agora,o.jornada) &&
       !confirm('Agora está DENTRO da jornada ('+fmtJornada(o.jornada)+').\n\nIniciar hora extra mesmo assim?')) return;
    const l=extrasDe(o).slice();
    l.push({de:agora.toISOString(),ate:null,por:usuarioAtual(),funcs:funcsDe(o,'inicio')});
    db.ref('ops/'+id).update({extras:l, extra:true, foraExpediente:true})
      .then(()=>toast('Hora extra iniciada às '+agora.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})))
      .catch(e=>toast('Erro: '+e.message));
  }
  function finalizarExtra(id){
    const o=OPS.find(x=>x.id===id); if(!o) return;
    const ab=extraAberta(o); if(!ab){ toast('Não há hora extra em andamento'); return; }
    const agoraISO=new Date().toISOString();
    const l=extrasDe(o).map(s=>(s.de===ab.de&&!s.ate)?Object.assign({},s,{ate:agoraISO}):s);
    const min=tempoExtraOP({...o,extras:l},agoraISO);
    db.ref('ops/'+id).update({extras:l, tempoExtraMin:min})
      .then(()=>toast('Hora extra finalizada — '+fmtMin(min)+' no total'))
      .catch(e=>toast('Erro: '+e.message));
  }
  function htmlExtraResumo(o){
    const l=extrasDe(o); if(!l.length) return '';
    return `<div class="he-res"><b>Hora extra</b>
      ${l.map((s,i)=>`<span>${i+1}. ${fmtHora(s.de)} → ${s.ate?fmtHora(s.ate):'<i>em curso</i>'}</span>`).join('')}
      <em>Total ${fmtMin(tempoExtraOP(o))}</em></div>`;
  }
  function htmlExtra(o){
    const st=stOp(o);
    if(st==='nao'||st==='encerrada') return htmlExtraResumo(o);
    const ab=extraAberta(o), agora=new Date(), fora=foraJornada(agora,o.jornada);
    if(!ab && !fora) return htmlExtraResumo(o);
    const min=tempoExtraOP(o);
    return `${htmlExtraResumo(o)}
      <div class="he-box ${ab?'on':''}">
        <div class="he-h">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <div class="he-l"><b>${ab?'Hora extra em andamento':'Fora da jornada'}</b>
            <span>${ab
              ? ('Desde '+fmtHora(ab.de)+(min?' · '+fmtMin(min)+' acumulados':''))
              : (motivoFora(agora,o.jornada)+' · agora '+agora.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}))}</span></div>
        </div>
        ${ab?`<button class="he-btn fim" onclick="finalizarExtra('${o.id}')">Finalizar hora extra</button>`
            :`<button class="he-btn ini" onclick="iniciarExtra('${o.id}')">Iniciar hora extra</button>`}
      </div>`;
  }

  // selo compacto do lead time para listas
  function htmlLeadMini(o){
    const L=leadStatus(o); if(!L) return '';
    return `<span class="lt-mini ${L.atrasado?'atr':''} ${L.rodando?'':'parado'}">`
      +`<i class="lt-dot"></i><span data-lt-op="${o.id}">${fmtCron(L.restSeg)}</span></span>`;
  }
  function htmlLead(o){
    const L=leadStatus(o); if(!L) return '';
    return `<div class="lt-box ${L.atrasado?'atr':''} ${L.rodando?'':'parado'}">
      <div class="lt-top">
        <span class="lt-dot"></span>
        <div class="lt-l"><b>${L.atrasado?'Lead time estourado':'Dentro do lead time'}</b>
          <span>Prazo ${fmtMin(L.leadMin)} · realizado ${fmtMin(Math.round(L.gastoMin))}${L.st==='pausada'?' · OP pausada, cronômetro parado':''}</span></div>
        <div class="lt-cr"><span data-lt-op="${o.id}">${fmtCron(L.restSeg)}</span>
          <em>${L.atrasado?'de atraso':'restante'}</em></div>
      </div>
      <div class="lt-bar"><i style="width:${L.pct}%"></i></div>
    </div>`;
  }

  function opSetorDe(sig){ return OP_SETORES[sig]||OP_SETORES.SL; }
  function opClienteAmbiente(o){
    const pl=o.projetosLote||[];
    if(!pl.length) return '';
    if(o.tipo==='lote'){
      if(pl.length===1) return [pl[0].cliente,pl[0].ambiente].filter(Boolean).join(' · ');
      return pl.length+' projetos do lote';
    }
    return [pl[0].cliente,pl[0].ambiente].filter(Boolean).join(' · ');
  }

  /* ================= 1. PAINEL DE CONTROLE ================= */
  const P_COLS=[
    {k:'lote',t:'Lote',w:'84px',ph:'0000'},{k:'projeto',t:'Projeto',w:'86px',ph:'00000'},
    {k:'cliente',t:'Cliente',w:'',ph:'Nome do cliente'},{k:'telefone',t:'Telefone',w:'126px',ph:'(00) 00000-0000'},
    {k:'local',t:'Local',w:'120px',ph:'Cidade'},{k:'ambiente',t:'Descrição do ambiente',w:'',ph:'Ex.: Cozinha'},
    {k:'consultor',t:'Consultor(a)',w:'112px',ph:'Nome'},{k:'dataEntrada',t:'Entrada programada',w:'132px',tipo:'date'}
  ];
  function linhaPainelVazia(){ const o={id:'pl'+Date.now()+Math.floor(Math.random()*900+100)}; P_COLS.forEach(c=>o[c.k]=''); o.ordem=Date.now(); return o; }

  /* ===== Status de emissão de OP por linha do Painel =====================
     vermelho : nenhuma OP emitida
     amarelo  : emitido em parte (inclui o caso "só Áreas de Apoio")
     verde    : todas as atividades já têm OP emitida
     Sublinha (SL) é OP de lote: vale para todos os projetos do mesmo lote. */
  function indiceEmissao(){
    const porProj=new Map(), porLote=new Map();
    OPS.forEach(o=>{
      const a=String(o.atividade||'').trim(); if(!a) return;
      const p=String(o.projeto||'').trim(), l=String(o.lote||'').trim();
      if(p){ if(!porProj.has(p)) porProj.set(p,new Map()); if(!porProj.get(p).has(a)) porProj.get(p).set(a,o); }
      if(l){ if(!porLote.has(l)) porLote.set(l,new Map()); if(!porLote.get(l).has(a)) porLote.get(l).set(a,o); }
    });
    return {porProj,porLote};
  }
  function emissaoDe(reg,idx){
    idx=idx||indiceEmissao();
    const ativs=todasAtividades(), total=ativs.length;
    const p=String((reg&&reg.projeto)||'').trim(), l=String((reg&&reg.lote)||'').trim();
    const mp=idx.porProj.get(p)||new Map(), ml=idx.porLote.get(l)||new Map();
    let feitas=0, foraApoio=0, apoioTot=0, apoioFeitas=0;
    const det=ativs.map(a=>{
      const op = a.porLote ? (l?ml.get(a.atividade):null) : (p?mp.get(a.atividade):null);
      if(a.setor==='APOIO'){ apoioTot++; if(op) apoioFeitas++; }
      else if(op) foraApoio++;
      if(op) feitas++;
      return {setor:a.setor, atividade:a.atividade, porLote:a.porLote, op:op||null};
    });
    let nivel,label;
    if(!p && !l){ nivel='vazio'; label='sem projeto'; }
    else if(!feitas){ nivel='nao'; label='Não emitido'; }
    else if(feitas>=total){ nivel='ok'; label='Emitido'; }
    else if(!foraApoio){ nivel='apoio'; label=(apoioFeitas>=apoioTot?'Só apoio':'Apoio parcial'); }
    else { nivel='parcial'; label='Parcial'; }
    return {feitas,total,nivel,label,det,projeto:p,lote:l};
  }
  const PL_COR={nao:'#b3261e', apoio:'#d3a41c', parcial:'#d3a41c', ok:'#2f8f46', vazio:'#c8c6bd'};
  const PL_PESO={nao:0, parcial:1, apoio:1, ok:2, vazio:3};
  function badgeEmissao(e,rid){
    if(e.nivel==='vazio')
      return '<span class="pl-badge pl-b-vazio" title="Informe o projeto ou o lote">'+e.label+'</span>';
    const falta=e.det.filter(a=>!a.op).map(a=>a.atividade);
    const tip=falta.length?('Falta emitir: '+falta.join(', ')):'Todas as OPs já emitidas';
    return '<button class="pl-badge pl-b-'+e.nivel+'" title="'+escHtml(tip)+'" onclick="painelDetalheEmissao(\''+rid+'\')">'
      +'<i></i>'+e.label+'<em>'+e.feitas+'/'+e.total+'</em></button>';
  }

    const r=PAINEL.find(x=>x.id===id); if(!r) return;

    const corpo='<div class="ple-l">'+Object.keys(porSetor).map(sig=>{

            +(a.op?'<u>OP '+escHtml(a.op.numero||'')+'</u>':'<s>não emitida</s>')+'</div>').join('');
    }).join('')+'</div>';
    abrirModal('Emissão de OP &middot; projeto '+escHtml(e.projeto||'—')+(e.lote?' &middot; lote '+escHtml(e.lote):''),
      '<p class="page-sub" style="margin:-4px 0 12px">'+e.feitas+' de '+e.total+' atividades com OP emitida.</p>'+corpo,
      '<button class="btn btn-ghost" onclick="fecharModal()">Fechar</button>'
      +'<button class="btn btn-primary" onclick="fecharModal();irAba(\'ops\')">Ver Ordens de Produção</button>');
  }
  function painelIrStatus(nivel){
    const idx=indiceEmissao();
    const i=PAINEL.findIndex(r=>{ const e=emissaoDe(r,idx);
      return nivel==='amarelo' ? (e.nivel==='apoio'||e.nivel==='parcial') : e.nivel===nivel; });
    if(i<0){ toast('Nenhuma linha nesse status'); return; }
    const el=document.querySelector('.pl-in[data-r="'+i+'"][data-c="0"]');
    if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.focus(); }
  }

        <div class="pls-bar"><div class="t">

      </div>

        ${[...new Set(PAINEL.map(r=>String(r.lote||'').trim()))].filter(Boolean).map(l=>{
          const rows=PAINEL.map((r,i)=>[r,EST[i]]).filter(([r])=>String(r.lote||'').trim()===l);

            <i style="background:${PL_COR[pior]}"></i>Lote <b>${escHtml(l)}</b><span>${rows.length}</span></button>`;

      <div class="table-wrap pl-wrap">

          <thead><tr><th class="pl-ck" style="width:34px"><input type="checkbox" class="ck" onchange="painelMarcarTodos(this.checked)"></th>
            <th class="pl-n" style="width:36px">#</th>
            ${P_COLS.map(c=>`<th class="pl-th-${c.k}"${c.w?` style="width:${c.w}"`:''}>${c.t}</th>`).join('')}
            <th class="pl-th-emissao" style="width:158px">Emissão de OP</th>
            <th style="width:40px"></th></tr></thead>
          <tbody id="painelBody">${linhasPainel(EST)}</tbody>
        </table>
      </div>
      ${!PAINEL.length?`<div class="empty" style="margin-top:16px"><div class="e-ic"><svg viewBox="0 0 24 24">${I.pcp}</svg></div>
        <h3>Painel vazio</h3><p>Adicione linhas ou cole os dados direto da sua planilha.</p>

  function linhasPainel(EST){
    let grupo=-1, ultLote=null, ultCli=null;
    if(!EST){ const ix=indiceEmissao(); EST=PAINEL.map(r=>emissaoDe(r,ix)); }
    return PAINEL.map((r,i)=>{
      const lote=String(r.lote||'').trim();
      const novoLote = lote!==ultLote;
      if(novoLote){ grupo++; ultCli=null; }
      const cli=String(r.cliente||'').trim();
      const repeteCli = !novoLote && cli && cli===ultCli;
      ultLote=lote; ultCli=cli;
      const par = grupo%2===1;
      return `<tr class="pl-r${par?' pl-par':''}${novoLote&&i>0?' pl-novo':''}${painelSel.has(r.id)?' row-sel':''}" data-id="${r.id}">
        <td class="pl-ck"><input type="checkbox" class="ck" ${painelSel.has(r.id)?'checked':''} onchange="painelMarcar('${r.id}',this.checked)"></td>
        <td class="pl-n">${i+1}</td>
        ${P_COLS.map((c,ci)=>{
          const v=String(r[c.k]||'');
          let cls='pl-in pl-'+c.k;
          if(c.k==='cliente'&&repeteCli) cls+=' pl-rep';
          if(!v) cls+=' pl-vaz';
          return `<td class="pl-td pl-td-${c.k}">${c.k==='lote'&&!novoLote
            ? `<input class="${cls} pl-lote-rep" data-r="${i}" data-c="${ci}" value="${v.replace(/"/g,'&quot;')}"
                 onchange="painelSet('${r.id}','${c.k}',this.value)" onkeydown="painelTecla(event,${i},${ci})">`
            : `<input class="${cls}" data-r="${i}" data-c="${ci}" type="${c.tipo||'text'}"
                 value="${v.replace(/"/g,'&quot;')}" placeholder="${c.ph||''}"
                 onchange="painelSet('${r.id}','${c.k}',this.value)" onkeydown="painelTecla(event,${i},${ci})">`}</td>`;
        }).join('')}
        <td class="pl-td pl-td-emissao">${badgeEmissao(EST[i],r.id)}</td>
        <td class="acoes pl-ac"><button class="icon-btn danger" title="Excluir" onclick="painelExcluir('${r.id}')">${TRASH_SVG}</button></td>
      </tr>`;
    }).join('');
  }
  function painelIrLote(l){
    const i=PAINEL.findIndex(r=>String(r.lote||'').trim()===l);
    if(i<0) return;
    const el=document.querySelector(`.pl-in[data-r="${i}"][data-c="0"]`);
    if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.focus(); }
  }
  function painelAdd(n){
    const novas=[]; for(let i=0;i<n;i++){ const l=linhaPainelVazia(); l.ordem=Date.now()+i; novas.push(l); }
    const upd={}; novas.forEach(l=>upd['painel/'+l.id]=l);
    db.ref().update(upd).catch(e=>toast('Erro: '+e.message));
  }
  function painelSet(id,campo,val){
    db.ref('painel/'+id+'/'+campo).set(val).catch(e=>toast('Erro: '+e.message));
    const r=PAINEL.find(x=>x.id===id); if(r) r[campo]=val;
    if(campo==='lote' && r){
      const proj=String(r.projeto||'').trim(), l=String(val||'').trim();
      if(proj && l) vincularLotePorProjeto(proj,l)
        .then(n=>{ if(n) toast(n+' OP(s) do projeto '+proj+' vinculadas ao lote '+l); })
        .catch(e=>toast('Erro ao vincular lote: '+e.message));
    }
  }
  function painelExcluir(id){
    const r=PAINEL.find(x=>x.id===id);
    if(!confirm(`Excluir a linha do lote ${r&&r.lote?r.lote:'(sem lote)'}?`)) return;
    db.ref('painel/'+id).remove().catch(e=>toast('Erro: '+e.message));
    painelSel.delete(id);
  }
  function painelMarcar(id,on){ on?painelSel.add(id):painelSel.delete(id); renderPainel(); }
  function painelMarcarTodos(on){ PAINEL.forEach(r=>on?painelSel.add(r.id):painelSel.delete(r.id)); renderPainel(); }
  function painelExcluirSel(){
    if(!confirm(`Excluir ${painelSel.size} linha(s) selecionada(s)?`)) return;
    const upd={}; painelSel.forEach(id=>upd['painel/'+id]=null);
    db.ref().update(upd).then(()=>{ painelSel.clear(); toast('Linhas excluídas'); }).catch(e=>toast('Erro: '+e.message));
  }
  function painelTecla(ev,r,c){
    const mover=(dr,dc)=>{
      const alvo=document.querySelector(`.pl-in[data-r="${r+dr}"][data-c="${c+dc}"]`);
      if(alvo){ ev.preventDefault(); alvo.focus(); alvo.select&&alvo.select(); }
    };
    if(ev.key==='ArrowDown'||ev.key==='Enter') mover(1,0);
    else if(ev.key==='ArrowUp') mover(-1,0);
    else if(ev.key==='Tab'&&!ev.shiftKey&&c===P_COLS.length-1) mover(1,-(P_COLS.length-1));
  }
  /* colar do Excel */
  let pasteLigado=false;
  function ligarPaste(){
    if(pasteLigado) return; pasteLigado=true;
    document.addEventListener('paste',ev=>{
      if(TELA!=='painel') return;
      const alvo=ev.target;
      if(alvo && (alvo.id==='colTxt' || alvo.tagName==='TEXTAREA')) return; // modal de colagem
      const txt=(ev.clipboardData||window.clipboardData||{}).getData?
        (ev.clipboardData||window.clipboardData).getData('text'):'';
      if(!txt) return;
      const multi = txt.indexOf('\t')>=0 || txt.trim().indexOf('\n')>=0;
      if(!multi) return; // colagem de 1 célula: comportamento normal do input
      ev.preventDefault();
      const cel=alvo&&alvo.closest?alvo.closest('.pl-in'):null;
      if(cel) colarPainel(txt, parseInt(cel.dataset.r,10), parseInt(cel.dataset.c,10));
      else colarPainel(txt, PAINEL.length, 0); // sem célula focada: acrescenta no final
    });
  }
  function colarPainel(txt,r0,c0){
    const linhas=txt.replace(/\r/g,'').split('\n').filter((l,i,a)=>l.length||i<a.length-1);
    if(!linhas.length) return;
    const grade=linhas.map(l=>l.split('\t'));
    const upd={}; const novas=[];
    grade.forEach((cols,li)=>{
      const idx=r0+li;
      let alvo=PAINEL[idx];
      if(!alvo){ alvo=linhaPainelVazia(); alvo.id='pl'+(Date.now()+idx)+Math.floor(Math.random()*900+100);
        alvo.ordem=Date.now()+idx; novas.push(alvo); }
      const dados={...alvo};
      cols.forEach((v,ci)=>{
        const col=P_COLS[c0+ci]; if(!col) return;
        let val=String(v).trim();
        if(col.tipo==='date') val=normalizaData(val);
        dados[col.k]=val;
      });
      upd['painel/'+dados.id]=dados;
    });
    db.ref().update(upd)
      .then(()=>toast(`${grade.length} linha(s) coladas`))
      .catch(e=>toast('Erro ao colar: '+e.message));
  }


  /* ---- colagem do Excel por modal (não depende de foco em célula) ---- */
  function abrirColar(){
    abrirModal('Colar do Excel',
      `<p style="font-size:13.5px;color:var(--muted);line-height:1.6;margin-bottom:12px">
        Selecione as linhas no Excel, copie (<b>Ctrl+C</b>), clique na caixa abaixo e cole (<b>Ctrl+V</b>).
        Não precisa incluir o cabeçalho.</p>
      <div class="col-ordem">Ordem esperada das colunas:
        ${P_COLS.map((c,i)=>`<span><b>${String.fromCharCode(65+i)}</b> ${c.t}</span>`).join('')}</div>
      <textarea id="colTxt" class="col-txt" placeholder="Cole aqui..." oninput="previewColar()"></textarea>
      <label class="chk" style="margin-top:12px"><input type="checkbox" id="colSubst">
        <span>Substituir todas as linhas atuais <i>(sem marcar, as linhas são adicionadas ao final)</i></span></label>
      <div id="colPrev"></div>`,
      `<button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button>
       <button class="btn btn-primary" id="btnColar" disabled style="opacity:.5" onclick="confirmarColar()">Colar</button>`);
    setTimeout(()=>{const t=document.getElementById('colTxt'); if(t) t.focus();},60);
  }
  function parseGrade(txt){
    return String(txt||'').replace(/\r/g,'').split('\n')
      .filter(l=>l.trim().length).map(l=>l.split('\t'));
  }
  function previewColar(){
    const g=parseGrade(document.getElementById('colTxt').value);
    const res=document.getElementById('colPrev'), btn=document.getElementById('btnColar');
    if(!g.length){ res.innerHTML=''; btn.disabled=true; btn.style.opacity='.5'; btn.textContent='Colar'; return; }
    const cols=Math.max(...g.map(r=>r.length));
    res.innerHTML=`<div class="col-prev">
      <div class="cp-r"><b>${g.length}</b> linha(s) · <b>${cols}</b> coluna(s) detectada(s)
        ${cols>P_COLS.length?`<span class="cp-w">as colunas além da ${P_COLS.length}ª serão ignoradas</span>`:''}</div>
      <table class="cp-t"><thead><tr>${P_COLS.slice(0,Math.min(cols,P_COLS.length)).map(c=>`<th>${c.t}</th>`).join('')}</tr></thead>
        <tbody>${g.slice(0,4).map(r=>`<tr>${P_COLS.slice(0,Math.min(cols,P_COLS.length)).map((c,i)=>
          `<td>${escHtml(String(r[i]||'').trim())||'—'}</td>`).join('')}</tr>`).join('')}
        ${g.length>4?`<tr><td colspan="${Math.min(cols,P_COLS.length)}" class="cp-m">… e mais ${g.length-4} linha(s)</td></tr>`:''}</tbody></table>
    </div>`;
    btn.disabled=false; btn.style.opacity='1'; btn.textContent=`Colar ${g.length} linha(s)`;
  }
  function confirmarColar(){
    const g=parseGrade(document.getElementById('colTxt').value);
    if(!g.length) return;
    const subst=document.getElementById('colSubst').checked;
    const btn=document.getElementById('btnColar'); btn.disabled=true; btn.textContent='Colando...';
    const upd={};
    if(subst) PAINEL.forEach(r=>upd['painel/'+r.id]=null);
    const base=Date.now();
    g.forEach((cols,li)=>{
      const id='pl'+(base+li)+Math.floor(Math.random()*900+100);
      const o={id, ordem:(subst?0:(PAINEL.length))+base+li};
      P_COLS.forEach((c,ci)=>{
        let v=String(cols[ci]||'').trim();
        if(c.tipo==='date') v=normalizaData(v);
        o[c.k]=v;
      });
      upd['painel/'+id]=o;
    });
    db.ref().update(upd)
      .then(()=>{
        fecharModal(); toast(`${g.length} linha(s) coladas`);
        return vincularLotes(Object.values(upd).filter(Boolean))
          .then(n=>{ if(n) toast(n+' OP(s) sem lote vinculadas ao lote do painel'); });
      })
      .catch(e=>{ btn.disabled=false; btn.textContent='Colar'; alert('Erro ao colar: '+e.message); });
  }

  function htmlFeriados(){
    const l=listaFeriados();

  /* ---- emissão ---- */



  /* ===== Vinculo retroativo de lote =====================================
     A Area de Apoio roda por projeto, antes de o lote existir. Quando o lote
     e definido no Painel de Controle, as OPs daquele projeto que ficaram sem
     lote passam a pertencer a ele. Regras:
       - so preenche OPs com lote VAZIO; nunca sobrescreve lote ja gravado
         (um projeto que entra num segundo lote nao remexe no historico);
       - grava o lote dentro da OP (backfill), entao o calculo de conclusao
         continua identico e o passado nao e reescrito por mudancas futuras;
       - update multi-path: ou grava tudo, ou nao grava nada.                */
  function vincularLotes(linhas){
    const mapa=new Map();
    (linhas||[]).forEach(r=>{
      const p=String((r&&r.projeto)||'').trim(), l=String((r&&r.lote)||'').trim();
      if(p&&l&&!mapa.has(p)) mapa.set(p,l);
    });
    if(!mapa.size) return Promise.resolve(0);
    const upd={}, agora=new Date().toISOString(); let n=0;
    OPS.forEach(o=>{
      const p=String(o.projeto||'').trim();
      if(!p || !mapa.has(p)) return;
      if(String(o.lote||'').trim()) return;          // ja tem lote: intocada
      upd['ops/'+o.id+'/lote']=mapa.get(p);
      upd['ops/'+o.id+'/loteVinculadoEm']=agora;
      n++;
    });
    if(!n) return Promise.resolve(0);
    return db.ref().update(upd).then(()=>n);
  }
  function vincularLotePorProjeto(projeto,lote){
    return vincularLotes([{projeto,lote}]);
  }

  function todasAtividades(){

  // progresso de um registro do painel (um projeto/ambiente)
  function progressoProjeto(reg){
    const ativs=todasAtividades(), passo=100/ativs.length;
    let pct=0, ultima=null, ultimaEm='';
    const detalhe=ativs.map(a=>{
      const op = a.porLote
        ? OPS.find(o=>o.atividade===a.atividade && String(o.lote).trim()===String(reg.lote||'').trim())
        : OPS.find(o=>o.atividade===a.atividade && String(o.projeto).trim()===String(reg.projeto||'').trim());
      const st=op?stOp(op):null;
      if(st==='encerrada') pct+=passo;
      else if(st==='parcial') pct+=passo/2;
      if(op && st && st!=='nao'){
        const quando=(op.fim&&op.fim.em)||(op.inicio&&op.inicio.em)||'';
        if(quando>ultimaEm){ ultimaEm=quando; ultima={atividade:a.atividade,setor:a.setor,status:st,op}; }
      }
      return {...a,op,status:st||'nao'};
    });
    pct=Math.round(pct);
    const cor = pct>=100?'#2f8f46' : (pct>0?'#d4930d':'#9a9aa2');
    const rot = pct>=100?'Finalizado' : (pct>0?'Em produção':'Não iniciado');
    return {pct,cor,rot,ultima,detalhe,total:ativs.length};
  }

  function lerBip(cod){
    cod=String(cod||'').trim().toUpperCase();
    if(!cod) return;
    let acao=null, num=cod;
    if(/^I\d+$/.test(cod)){ acao='inicio'; num=cod.slice(1); }
    else if(/^F\d+$/.test(cod)){ acao='fim'; num=cod.slice(1); }
    const o=OPS.find(x=>String(x.numero)===num);
    if(!o){ toast('OP '+num+' não encontrada'); return; }
    if(acao==='inicio'){ abrirApont(o.id); setTimeout(()=>iniciarOP(o.id),120); return; }
    if(acao==='fim'){ abrirApont(o.id); setTimeout(()=>finalizarOP(o.id),120); return; }
    abrirApont(o.id);
  }

  let apListaAtual=[];
  function togFunc(i){
    const f=apListaAtual[i]; if(!f) return;
    const k=apFuncs.indexOf(f.nome);

    abrirApont(apontOP);

  function confirmaFora(o,quando){
    if(dentroExpediente(quando,o.jornada)) return true;
    return confirm('Você está fora do horário de expediente ('+motivoFora(quando,o.jornada)+').\n\n'+
      'Jornada: '+fmtJornada(o.jornada)+'\nAgora: '+quando.toLocaleString('pt-BR')+
      '\n\nTem certeza que deseja continuar?');
  }
  function confirmaExtra(o,quando){
    if(dentroExpediente(quando,o.jornada)) return false;
    return confirm('APONTAR COMO HORA EXTRA?\n\nVocê está iniciando '+motivoFora(quando,o.jornada)+'.\n\n'+
      'Marcando como hora extra, este tempo é contado separadamente e você precisa encerrar a OP manualmente.\n\n'+
      'OK = hora extra · Cancelar = apontamento comum (sem contar o tempo fora da jornada)');
  }
  function iniciarOP(id){
    const o=OPS.find(x=>x.id===id); if(!o) return;
    if(stOp(o)==='pausada'){ retomarOP(id); return; }
    if(stOp(o)!=='nao'){ toast('Esta OP já foi iniciada'); return; }
    const lista=apFuncs.length?apFuncs.slice():[(aptosPara(o.atividade,o.setor)[0]||{}).nome].filter(Boolean);
    if(!lista.length){ toast('Selecione ao menos um funcionário'); return; }
    const agora=new Date();
    if(!confirmaFora(o,agora)) return;
    const fora=!dentroExpediente(agora,o.jornada);
    // fora da jornada a sessão de hora extra já abre junto — o operador encerra pelo botão
    const he=foraJornada(agora,o.jornada);
    const agoraISO=agora.toISOString();
    const upd={status:'parcial',
      inicio:{funcs:lista,func:lista[0],em:agoraISO,por:usuarioAtual(),fora},
      foraExpediente:fora||!!o.foraExpediente,
      extra:he||!!o.extra};
    if(he) upd.extras=extrasDe(o).concat([{de:agoraISO,ate:null,por:usuarioAtual(),funcs:lista}]);
    const lm=leadMinOP(o); if(lm!=null) upd.leadMin=lm;
    db.ref('ops/'+id).update(upd)
      .then(()=>{ toast('OP iniciada'+(he?' em HORA EXTRA':'')+' — '+lista.join(', ')); abrirApont(id); })
      .catch(e=>toast('Erro: '+e.message));
  }
  function finalizarOP(id){
    const o=OPS.find(x=>x.id===id); if(!o) return;
    if(stOp(o)==='nao'){ toast('Esta OP ainda não foi iniciada'); return; }
    if(stOp(o)==='encerrada'){ toast('Esta OP já está encerrada'); return; }
    const lista=apFuncs.length?apFuncs.slice():funcsDe(o,'inicio');
    const agora=new Date(), agoraISO=agora.toISOString();
    if(!confirmaFora(o,agora)) return;
    const fora=!dentroExpediente(agora,o.jornada);
    const pl=pausasDe(o).map(p=>(p.de&&!p.ate)?{...p,ate:agoraISO}:p);
    const xl=extrasDe(o).map(s=>(s.de&&!s.ate)?{...s,ate:agoraISO}:s);   // fecha hora extra aberta
    const tmp={...o,pausas:pl,extras:xl};
    const norm=tempoNormalOP(tmp,agoraISO), ext=tempoExtraOP(tmp,agoraISO);
    const pausado=minutosPausados(tmp,agoraISO);
    const lm=leadMinOP(o);
    db.ref('ops/'+id).update({status:'encerrada',
      fim:{funcs:lista,func:lista[0]||'',em:agoraISO,por:usuarioAtual(),fora},
      pausas:pl, tempoMin:norm+ext, tempoNormalMin:norm, tempoExtraMin:ext, tempoPausaMin:pausado,
      foraExpediente:fora||!!o.foraExpediente,
      ...(xl.length?{extras:xl}:{}),
      ...(lm!=null?{leadMin:lm, leadDesvioMin:(norm+ext)-lm}:{})})
      .then(()=>{ toast('OP encerrada — '+fmtMin(norm+ext)+(ext?' ('+fmtMin(ext)+' extra)':'')
        +(lm!=null?((norm+ext)>lm?' · ATRASO de '+fmtMin((norm+ext)-lm):' · dentro do lead time'):'')); abrirApont(id); })
      .catch(e=>toast('Erro: '+e.message));
  }


/* ================= LEAD TIME — cadastro e painel de atrasos ================= */
  const LT={ aba:'cad', proj:null, busca:'', filtro:'' };

  function ltOpDoRegistro(reg,a){
    return a.porLote
      ? OPS.find(o=>o.atividade===a.atividade && String(o.lote).trim()===String(reg.lote||'').trim())
      : OPS.find(o=>o.atividade===a.atividade && String(o.projeto).trim()===String(reg.projeto||'').trim());
  }
  function ltQtdProjeto(reg){
    const l=LEADS[ltSlug(String((reg&&reg.projeto)||'').trim())]||{};
    return Object.keys(l).filter(k=>Number(l[k]&&l[k].horas)>0).length;
  }
  function ltResumoProjeto(reg){
    let ok=0, atr=0, encAtr=0;
    todasAtividades().forEach(a=>{
      const op=ltOpDoRegistro(reg,a); if(!op) return;
      const L=leadStatus(op); if(!L) return;
      if(L.atrasado){ atr++; if(L.st==='encerrada') encAtr++; } else ok++;
    });
    return {ok,atr,encAtr};
  }

  function renderLead(aba){
    TELA='lead';
    if(aba){ LT.aba=aba; if(aba==='dash') LT.proj=null; }
    if(LT.aba==='cad' && LT.proj) return ltTelaProjeto(LT.proj);
    view.innerHTML=`<div class="page page-wide">
      <div class="page-head"><div><h1 class="page-title">Lead time</h1>
        <p class="page-sub">Prazo de execução por atividade, definido projeto a projeto</p></div></div>
      <div class="lt-abas">
        <button class="lta ${LT.aba==='cad'?'on':''}" onclick="renderLead('cad')">Cadastro de Lead time</button>
        <button class="lta ${LT.aba==='dash'?'on':''}" onclick="renderLead('dash')">Painel de atrasos</button>
      </div>
      ${LT.aba==='cad'?ltHtmlCadastro():ltHtmlDash()}
    </div>`;
  }

  /* ---------- aba 1: cadastro ---------- */
  function ltHtmlCadastro(){

      precisam de prazo. ${comLead} de ${PAINEL.length} projeto(s) já têm pelo menos um prazo definido.</p>

          return `<tr class="ac-row" onclick="ltAbrir('${r.id}')">

            <td class="cel-disc">${escHtml(r.cliente)||'—'}</td>
            <td>${n?`<span class="lt-tag">${n} de ${nAt} atividade(s)</span>`
                   :'<span class="sem-op">nenhum prazo definido</span>'}</td>
            <td>${s.atr?`<span class="lt-mini atr"><i class="lt-dot"></i>${s.atr} atrasada(s)</span>`

                       :'<span class="sem-op">—</span>')}</td>
          </tr>`;}).join('')}</tbody></table></div>`
      :`<div class="empty"><div class="e-ic"><svg viewBox="0 0 24 24">${I.pcp}</svg></div>
        <h3>Nenhum projeto</h3><p>${PAINEL.length?'Nenhum projeto atende à busca.':'Cadastre os projetos no Painel de Controle.'}</p></div>`}`;
  }
  function ltAbrir(id){ LT.proj=id; renderLead('cad'); }
  function ltVoltar(){ LT.proj=null; renderLead('cad'); }

  function ltTelaProjeto(id){
    const reg=PAINEL.find(r=>r.id===id); if(!reg){ LT.proj=null; return renderLead('cad'); }
    TELA='lead';
    const proj=String(reg.projeto||'').trim();
    const ativs=todasAtividades();
    const totH=ativs.reduce((a,x)=>a+(leadHoras(proj,x.atividade)||0),0);
    const porSetor=Object.values(OP_SETORES).map(S=>({S,
      itens:ativs.map((a,i)=>({a,i})).filter(x=>x.a.setor===S.sigla)}));
    view.innerHTML=`<div class="page page-wide">
      <div class="page-head">
        <div><h1 class="page-title">Lead time · projeto ${escHtml(proj)||'—'}</h1>
          <p class="page-sub">${escHtml(reg.ambiente)||'—'} · ${escHtml(reg.cliente)||'—'}${reg.lote?' · Lote '+escHtml(reg.lote):''}</p></div>
        <div style="display:flex;gap:10px">
          ${reg.lote?`<button class="btn btn-ghost" onclick="ltAplicarLote('${reg.id}')">Aplicar a todo o lote</button>`:''}
          <button class="btn btn-ghost" onclick="ltVoltar()">Voltar</button></div></div>
      ${proj?'':'<p class="aviso" style="margin-bottom:14px"><b>Esta linha do painel não tem projeto.</b> Informe o número do projeto no Painel de Controle antes de definir prazos.</p>'}
      <p class="aviso" style="margin-bottom:14px">Prazo em <b>horas de trabalho</b> (o cronômetro só anda dentro da jornada e para junto com a OP).
        Deixe em branco para não controlar a atividade. Total definido: <b>${totH?fmtMin(Math.round(totH*60)):'—'}</b>.</p>
      ${porSetor.map(({S,itens})=>`
        <section class="fs" style="margin-bottom:14px">
          <h3 class="fs-title" style="color:${S.cor}">${S.sigla} — ${escHtml(S.nome)}${S.tipo==='lote'?' <i class="tag-lote">por lote</i>':''}</h3>
          <div class="ltc-l">${itens.map(({a,i})=>{
            const h=leadHoras(proj,a.atividade), op=ltOpDoRegistro(reg,a), L=op?leadStatus(op):null;
            return `<div class="ltc-i ${h!=null?'on':''}">
              <div class="ltc-n"><b>${escHtml(a.atividade)}</b>
                <span>${op?(ST_OP[stOp(op)].label+' · OP '+escHtml(op.numero||'')
                            +(op.tempoMin?' · '+fmtMin(op.tempoMin):'')):'OP não emitida'}</span></div>
              ${L?htmlLeadMini(op):''}
              <div class="ltc-in">
                <input class="lt-inp" type="number" min="0" step="0.25" inputmode="decimal"
                  value="${h!=null?h:''}" placeholder="—"
                  onchange="ltSalvar('${reg.id}',${i},this.value)"><span>h</span></div>
            </div>`;}).join('')}</div>
        </section>`).join('')}
    </div>`;

  function ltSalvar(regId,idx,val){
    const reg=PAINEL.find(r=>r.id===regId); if(!reg) return;
    const a=todasAtividades()[idx]; if(!a) return;
    const proj=String(reg.projeto||'').trim();
    if(!proj){ toast('Esta linha do painel não tem projeto'); renderLead(); return; }
    const h=parseFloat(String(val==null?'':val).replace(',','.'));
    const ref=db.ref('leadtimes/'+ltSlug(proj)+'/'+ltSlug(a.atividade));
    if(!isFinite(h)||h<=0){
      ref.remove().then(()=>toast('Prazo removido de '+a.atividade)).catch(e=>toast('Erro: '+e.message));
      return;
    }
    ref.set({projeto:proj, atividade:a.atividade, setor:a.setor, horas:h,
      por:usuarioAtual(), em:new Date().toISOString()})
      .then(()=>toast(a.atividade+' — prazo de '+fmtMin(Math.round(h*60))))
      .catch(e=>toast('Erro: '+e.message));
  }
  function ltAplicarLote(regId){
    const reg=PAINEL.find(r=>r.id===regId); if(!reg) return;
    const proj=String(reg.projeto||'').trim(), lote=String(reg.lote||'').trim();
    if(!proj||!lote){ toast('Linha sem projeto ou sem lote'); return; }
    const base=LEADS[ltSlug(proj)]||{};
    const chaves=Object.keys(base).filter(k=>Number(base[k]&&base[k].horas)>0);
    if(!chaves.length){ toast('Defina ao menos um prazo antes de copiar'); return; }
    const alvos=[...new Set(PAINEL.filter(r=>String(r.lote||'').trim()===lote)
      .map(r=>String(r.projeto||'').trim()).filter(p=>p&&p!==proj))];
    if(!alvos.length){ toast('Nenhum outro projeto neste lote'); return; }
    if(!confirm('Copiar '+chaves.length+' prazo(s) do projeto '+proj+' para '+alvos.length

    iniciarExtra,finalizarExtra,extrasDe,extraAberta,foraJornada});

  // ===== PWA: service worker (instalação e atualização automática) =====
  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>{
      navigator.serviceWorker.register('./sw.js').then(reg=>{
        reg.addEventListener('updatefound',()=>{
          const nv=reg.installing;
          if(nv) nv.addEventListener('statechange',()=>{
            if(nv.state==='installed'&&navigator.serviceWorker.controller) nv.postMessage({tipo:'ativar'});
          });
        });
      }).catch(err=>console.warn('SW não registrado:',err));
    });
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(window.__recarregando) return; window.__recarregando=true; location.reload();
    });
  }
</script>
</body>
</html>
